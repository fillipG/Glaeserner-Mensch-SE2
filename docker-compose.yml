# ==============================================================================
# 🏛️ MUSEUM AI PIPELINE - DOCKER COMPOSE KONFIGURATION
# ==============================================================================
# ANLEITUNG FÜR NEUE MODELLE:
# 1. Erstelle einen neuen Service-Eintrag (siehe Beispiel unten).
# 2. 'build': Pfad zu deinem Ordner mit dem Dockerfile.
# 3. 'volumes': Verknüpfe unbedingt './faces_yolo' (Input) und './final' (Output).
# 4. 'volumes': Verknüpfe './config.yaml', wenn dein Modell die globale Config braucht. Moondream braucht z.B. den Prompt.
# 5. 'deploy': Nur nötig, wenn dein Modell eine NVIDIA GPU benötigt.
# 6. 'restart': always sorgt dafür, dass der container immer startet, wenn Docker Desktop startet
# 6. 'restart': unless-stopped sorgt dafür, dass der container nur dann beim Start von Docker Desktop startet,
#     wenn man ihn nicht vorher manuell beendet
# ==============================================================================

services:

  moondream:
    build: General ordner/moondream_ai
    image: museum-moondream
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ANALYSIS_PROMPT=${MOONDREAM_PROMPT}
    volumes:
      - "./General ordner/moondream_ai/moondream_inbox:/app/moondream_inbox"
      - "./General ordner/ollama_ai/ollama_inbox:/app/ollama_inbox"
      - "./config.yaml:/app/config.yaml"
    restart: unless-stopped

  ollama:
    build: General ordner/ollama_ai
    image: museum-ollama-worker
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - "./General ordner/ollama_ai/ollama_inbox:/app/ollama_inbox"
      - "./General ordner/final:/app/final"
      - "./config.yaml:/app/config.yaml"
    restart: unless-stopped

