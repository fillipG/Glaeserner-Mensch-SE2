version: '3.8'

services:
  body-extraction:
    build: .
    container_name: body-extraction-app
    # Verhindert, dass der Container sofort nach Fehlern beendet wird (optional)
    restart: unless-stopped
    volumes:
      # Verknüpft das aktuelle Verzeichnis (.) mit /app im Container
      - .:/app
      
      # Greift auf den globalen Ordner "main_image" eine Ebene höher zu
      - ../main_image:/app/main_image
      
      # Falls die Ergebnisse in den globalen "faces_yolo" Ordner sollen:
      - ../moondream_ai/moondream_inbox:/app/moondream_inbox
      
      # Cache-Ordner: Verhindert erneutes Herunterladen der KI-Modelle
      - ./models_cache/rembg:/root/.u2net
      - ./models_cache/yolo:/app/models
    environment:
      # Sorgt dafür, dass Python-Logs sofort im Terminal erscheinen
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]