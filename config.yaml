    crime story to the person
- id: deepface
  name: Emotionserkennung
  enabled: true
  watch_dir: ./final
  file_ext: .yaml
- id: fer
  name: Emotionserkennung (FER)
  enabled: true
  watch_dir: ./final
  file_ext: .yaml
