language: de
developer_mode: false
photo_delay: 3
reset_countdown_seconds: 3
close_on_no_person_enabled: true
close_on_no_person_seconds: 10
no_person_check_interval_ms: 2000
animation_speed: 15
camera:
  width: 1280
  height: 720
live_deepface:
  enabled: true
  interval_seconds: 3
  max_faces: 4
fullscreen: true
face_yolo:
  confidence: 0.5
pool:
  enabled: true
  path: ./pool
  max_extra_persons: 3
  cooldown_batches: 3
paths:
  final_dir: General ordner/final
  ollama_inbox: General ordner/ollama_ai/ollama_inbox
  moondream_inbox: General ordner/moondream_ai/moondream_inbox
  deepface_inbox: General ordner/docker-compose-deepface/deepface_inbox
  main_image: General ordner/main_image
  sketch_dir: General ordner/sketch
pipeline:
- id: moondream
  name: Visual Description (VLM)
  enabled: true
  final_output: false
  watch_dir: ./General ordner/ollama_ai/ollama_inbox
  file_ext: .yaml
  show_preview: true
  prompt: Name the clothing and any accessories the person is wearing. Put in 4 Sentences
- id: ollama
  name: Kriminalgeschichte (Ollama)
  enabled: true
  final_output: true
  watch_dir: ./General ordner/final
  file_ext: .yaml
  prompt: 'Write a criminal report about a fictional person.

    The person has already been described. Write only what crime

    the person might have committed in a short flowing paragraph.

    Make sure it is a crime within the Stasi context.

    The output must be between 30 and 50 words long.

    Stay within this range and try to make it a little funny.

    The story does not need to be explained. It is enough to show one crime.

    Output only a single paragraph with no line breaks.'
- id: deepface
  name: Emotionserkennung
  enabled: true
  final_output: true
  watch_dir: ./General ordner/final
  file_ext: .yaml
  use_retinaface: true
- id: fer
  name: Emotionserkennung (FER)
  enabled: false
  final_output: true
  watch_dir: ./General ordner/final
  file_ext: .yaml
llm_model: qwen2.5:3b
pipeline_timeout_seconds: 1000
