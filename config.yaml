language: de
developer_mode: false
wait_time_file_closed: 3
reset_countdown_seconds: 3
animation_speed: 20
fullscreen: true
photo_delay: 3
face_yolo:
  confidence: 0.5
pool:
  enabled: true
  path: ./pool
  max_extra_persons: 3
  cooldown_batches: 2
pipeline:
- id: moondream
  name: Visual Description (VLM)
  enabled: true
  watch_dir: ./General ordner/final
  file_ext: .yaml
  show_preview: true
  prompt: Name the clothing and any accessories the person is wearing and tell a imagined
    crime story to the person
- id: deepface
  name: Emotionserkennung
  enabled: true
  watch_dir: ./General ordner/final
  file_ext: .yaml
  use_retinaface: true
- id: fer
  name: Emotionserkennung (FER)
  enabled: false
  watch_dir: ./General ordner/final
  file_ext: .yaml
llm_model: phi3:3.8b
pipeline_timeout_seconds: 600
